name: YazmaBackup CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'feature/**'
      - 'fix/**'

permissions:
  contents: read

concurrency:
  group: yazmabackup-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-quality-gate:
    name: Windows quality gate
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm
          cache-dependency-path: src/YazmaBackup.Frontend/package-lock.json

      - name: Frontend install
        working-directory: src/YazmaBackup.Frontend
        run: npm ci

      - name: Frontend production audit
        working-directory: src/YazmaBackup.Frontend
        run: npm audit --omit=dev --audit-level=high

      - name: Frontend typecheck
        working-directory: src/YazmaBackup.Frontend
        run: npm run typecheck

      - name: Frontend Turkish localization gate
        working-directory: src/YazmaBackup.Frontend
        run: npm run localization:check

      - name: Frontend production build
        working-directory: src/YazmaBackup.Frontend
        run: npm run build

      - name: Verify automated test projects exist
        shell: pwsh
        run: |
          $projects = @(Get-ChildItem .\tests -Recurse -Filter '*Tests.csproj' -ErrorAction Stop)
          if ($projects.Count -lt 4) {
            throw "Expected at least 4 automated test projects, found $($projects.Count). R28 CI fails closed."
          }
          $projects | ForEach-Object { Write-Host "TEST PROJECT: $($_.FullName)" }

      - name: Restore production projects
        shell: pwsh
        run: |
          $projects = @(Get-ChildItem .\src -Recurse -Filter '*.csproj' -ErrorAction Stop)
          foreach ($project in $projects) {
            Write-Host "RESTORE PRODUCTION: $($project.FullName)"
            dotnet restore $project.FullName --nologo -p:TreatWarningsAsErrors=false
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Restore test projects with diagnostics
        shell: pwsh
        run: |
          $projects = @(Get-ChildItem .\tests -Recurse -Filter '*Tests.csproj' -ErrorAction Stop)
          foreach ($project in $projects) {
            Write-Host "RESTORE TEST: $($project.FullName)"
            dotnet restore $project.FullName --nologo -p:TreatWarningsAsErrors=false --verbosity normal
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Build production projects warnings as errors
        shell: pwsh
        run: |
          $projects = @(Get-ChildItem .\src -Recurse -Filter '*.csproj' -ErrorAction Stop)
          foreach ($project in $projects) {
            Write-Host "BUILD PRODUCTION: $($project.FullName)"
            dotnet build $project.FullName -c Release --no-restore --nologo -warnaserror
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Build automated test projects with analyzer policy
        shell: pwsh
        run: |
          $projects = @(Get-ChildItem .\tests -Recurse -Filter '*Tests.csproj' -ErrorAction Stop)
          foreach ($project in $projects) {
            Write-Host "BUILD TEST: $($project.FullName)"
            dotnet build $project.FullName -c Release --no-restore --nologo
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Run automated test suite with coverage
        shell: pwsh
        run: |
          $projects = @(Get-ChildItem .\tests -Recurse -Filter '*Tests.csproj' -ErrorAction Stop)
          foreach ($project in $projects) {
            $results = Join-Path artifacts/test-results $project.BaseName
            dotnet test $project.FullName -c Release --no-build --no-restore `
              --logger "trx;LogFileName=tests.trx" --results-directory $results `
              --collect "XPlat Code Coverage"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Enterprise SelfTest
        run: dotnet run --project src/YazmaBackup.SelfTest -c Release --no-build

      - name: Complete Windows PowerShell 5.1 verification
        shell: powershell
        run: .\scripts\VERIFY.ps1

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-and-coverage
          path: artifacts/test-results
          if-no-files-found: warn
          retention-days: 30
