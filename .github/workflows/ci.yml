name: YazmaBackup CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'feature/**'
      - 'fix/**'

permissions:
  contents: read

concurrency:
  group: yazmabackup-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-quality-gate:
    name: Windows quality gate
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm
          cache-dependency-path: src/YazmaBackup.Frontend/package-lock.json

      - name: Frontend install
        working-directory: src/YazmaBackup.Frontend
        run: npm ci

      - name: Frontend production audit
        working-directory: src/YazmaBackup.Frontend
        run: npm audit --omit=dev --audit-level=high

      - name: Frontend typecheck
        working-directory: src/YazmaBackup.Frontend
        run: npm run typecheck

      - name: Frontend production build
        working-directory: src/YazmaBackup.Frontend
        run: npm run build

      - name: Restore complete solution
        run: dotnet restore .\YazmaBackup.sln --nologo

      - name: Build complete solution warnings as errors
        run: dotnet build .\YazmaBackup.sln -c Release --no-restore --nologo -warnaserror

      - name: Verify automated test projects exist
        shell: pwsh
        run: |
          $projects = @(Get-ChildItem .\tests -Recurse -Filter '*Tests.csproj' -ErrorAction Stop)
          if ($projects.Count -lt 3) {
            throw "Expected at least 3 automated test projects, found $($projects.Count). R28 CI fails closed."
          }
          $projects | ForEach-Object { Write-Host "TEST PROJECT: $($_.FullName)" }

      - name: Run automated test suite with coverage
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/test-results | Out-Null
          dotnet test .\YazmaBackup.sln `
            -c Release `
            --no-build `
            --no-restore `
            --logger "trx;LogFileName=yazmabackup-tests.trx" `
            --results-directory .\artifacts\test-results `
            --collect "XPlat Code Coverage"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Enterprise SelfTest
        run: dotnet run --project src/YazmaBackup.SelfTest -c Release --no-build

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-and-coverage
          path: artifacts/test-results
          if-no-files-found: error
          retention-days: 30
